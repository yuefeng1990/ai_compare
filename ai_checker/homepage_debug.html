<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenAtom OpenHarmony</title>
  <style>
    body {
      margin: 0;
    }

    .inner {
      width: 100vw;
      height: 100vh;
      background-image: url("img/back.jpg");
      background-position: center;
      background-size: cover;
      position: relative;
    }

    .logo {
      position: absolute;
      top: 40px;
      left: 136px;
    }

    .container {
      width: 421px;
      height: 505px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .bck-color {
      position: absolute;
      width: 100%;
      height: 505px;
      border-radius: 4px;
      background-color: #fff;
      opacity: 1;
      z-index: 1;
    }
    .login-box {
      position: absolute;
      z-index: 2;
      width: 100%;
      padding-top: 115px;
      padding-bottom: 24px;
    }
    .title {
      text-align: center;
      margin: auto;
      margin-bottom: 54px;
    }
    .title > p {
      font-family: HarmonyOS_Sans_SC_Medium;
      font-size: 44px;
      line-height: 66px;
      color: #000000;
      /* opacity: 0.8; */
      font-weight: 500;
      margin: 0;
    }
    .btn {
      width: 164px;
      height: 48px;
      margin: auto;
      background-color: #00A6F9;
      color: #fff;
      font-family: HarmonyOS_Sans_SC;
      font-size: 16px;
      line-height: 48px;
      border-radius: 30px;
      text-align: center;
      margin-bottom: 40px;
      cursor: pointer;
    }
    .btn:hover{
      background-color: #017FE3;
      color: #fff;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.3);
    }
    .info {
      opacity: 0.8;
      font-family: HarmonyOS_Sans_SC_Medium;
      font-size: 16px;
      color: #000000;
      text-align: center;
      font-weight: 500;
      margin-bottom: 59px;
    }
    .tips {
      font-family: HarmonyOS_Sans_SC_Medium;
      font-size: 12px;
      color: rgba(0, 0, 0, 0.50);
      font-weight: 500;
      text-align: center;
      z-index: 2;
    }
  </style>

  <script>
    // 登陆判断父页面是否跳转到登录页
    if (window.top!=null && window.top.document.URL!=document.URL){
      window.top.location= document.URL;
    }
  </script>
</head>
<body>
<div class="inner">
  <div class="logo">
    <img src="/mng/img/logo.png" alt="">
  </div>
  <div class="container">
    <div class="bck-color"></div>
    <div class="login-box">
      <div class="title">
        <p>OpenHarmony</p>
        <p>后台管理系统</p>
      </div>
      <div class="btn" onclick="login();">立即登录</div>
      <div class="info">将前往“开放原子开源基金会”网站登录</div>
      <div class="tips">
        Copyright © 2022 OPENATOM FOUNDATION. All rights reserved.
      </div>
      <input id="loginUrl" type="hidden" value="https://openatom.cn/oauth/authorizeCheck?response_type=code&amp;client_id=f8ff29c0a8bd11ec82ab8919a30ea712&amp;scope=userBasicInfo&amp;redirect_uri=https://compatibility.openharmony.cn/mng/logon?state=" style="">
    </div>
  </div>
</div>
<script src="/mng/js/jquery.min.js"></script>
<script type="text/javascript">
  history.replaceState({},'','/mng/login')

  function login(){
    location.href = $('#loginUrl').val();
  }

</script>

</body></html>
